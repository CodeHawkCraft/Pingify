services:
  postgres:
    image: postgres:17-alpine
    env_file: ./pingify-backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./pingify-backend
    # Create/update tables on every start (no-op when already up to date).
    command: sh -c "node node_modules/knex/bin/cli.js migrate:latest --knexfile dist/knexfile.js && node dist/index.js"
    env_file: ./pingify-backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./pingify-worker
    env_file: ./pingify-worker/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./pingify-frontend
      # Vite puts this API URL directly into the frontend code when building the app.
      # The browser then uses /api, and nginx forwards it to the backend.
      args:
        VITE_API_URL: /api
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata: