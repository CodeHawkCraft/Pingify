services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pingify
      POSTGRES_PASSWORD: pingify
      POSTGRES_DB: pingify
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pingify -d pingify"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./pingify-backend
    environment:
      # Use Docker service names instead of localhost.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: pingify
      DB_PASSWORD: pingify
      DB_NAME: pingify

      PORT: 3000
      NODE_ENV: development
      JWT_SECRET: 7f3c9a2e5d8b1f604c7a93e2f1d8b6a4

      REDIS_URL: redis://redis:6379
      REDIS_STREAM_NAME: pingify:pings

      FRONTEND_URL: https://pingifyhub.duckdns.org
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./pingify-worker
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: pingify
      DB_PASSWORD: pingify
      DB_NAME: pingify

      PORT: 3002
      NODE_ENV: development

      REDIS_URL: redis://redis:6379
      REDIS_STREAM_NAME: pingify:pings
      REDIS_GROUP_NAME: pingify-workers

      REDIS_CONSUMER_1: worker-1
      REDIS_CONSUMER_2: worker-2
      REDIS_CONSUMER_3: worker-3
      REDIS_CONSUMER_4: worker-recovery
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./pingify-frontend
    # No ports: only Caddy is reachable from outside, it forwards to here.
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Without this volume every restart requests a
      # new cert and Let's Encrypt rate-limits you.
      - caddy_data:/data
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data: