# Mounted at /etc/nginx/conf.d/default.conf -- this is a server block, not a
# full nginx.conf. One origin for the whole app: same-site cookies, no CORS,
# no API hostname baked into the frontend bundle.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Caddy gzipped by default; nginx does not. A React bundle compresses ~3x.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS. Resolving through a variable defers the lookup to
    # request time -- otherwise nginx caches the backend's IP from startup and
    # 502s forever after the backend container restarts with a new one.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # No URI part on proxy_pass, so the full /api/... path reaches Express,
        # which mounts its router at /api (index.ts:24).
        set $upstream http://backend:3000;
        proxy_pass $upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
